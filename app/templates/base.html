<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}bppassport{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/home">bppassport</a>
    {% if user %}
    <nav class="nav">
      <a href="/home">收件箱</a>
      <a href="/send">发送</a>
      <a href="/pair">配对设备</a>
      <span class="me">{{ user.name }} <a class="logout" href="/logout">退出</a></span>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>bppassport · 家庭语音留言</span>
  </footer>
</body>
</html>
